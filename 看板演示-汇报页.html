<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EY CSDC · Daily Management 看板演示</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:#2e2e38;color:#fff;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .logo{background:#ffe600;color:#2e2e38;font-weight:800;padding:6px 12px;border-radius:4px;font-size:22px;}
  h1{font-size:22px;font-weight:600;}
  .sub{font-size:13px;color:#bdbdc7;margin-top:3px;}
  .videowrap{background:#000;border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5);max-width:1100px;width:100%;}
  video{width:100%;display:block;}
  .cap{margin-top:16px;font-size:13px;color:#9aa0a6;text-align:center;max-width:760px;line-height:1.8;}
  .tags{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .tag{background:#3a3a45;border:1px solid #4a4a55;border-radius:16px;padding:5px 14px;font-size:12px;color:#e3e3e8;}
</style>
</head>
<body>
  <div class="head">
    <span class="logo">EY</span>
    <div>
      <h1>Daily Management 看板</h1>
      <div class="sub">底稿交付中心 (CSDC) · 项目进度 / 函证 / OS / 预算管控</div>
    </div>
  </div>

  <div class="videowrap">
    <video src="EY-看板演示.mp4" autoplay muted loop controls playsinline></video>
  </div>

  <div class="cap">零成本、Excel 驱动、全员可见的每日管理看板。维护者更新台账后一键生成共享数据，团队打开即看最新进度。</div>
  <div class="tags">
    <span class="tag">5 大维度</span>
    <span class="tag">电子函证占比追踪</span>
    <span class="tag">内/外部卡点预警</span>
    <span class="tag">预算超支提醒</span>
    <span class="tag">一键导出 PDF</span>
  </div>
</body>
</html>
