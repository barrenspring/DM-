<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Management 看板 · 底稿交付中心</title>

<!-- ===== 依赖库（如公司网络屏蔽 CDN，请看文件底部的“离线使用”说明）===== -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  :root{
    --ey-black:#2e2e38;
    --ey-yellow:#ffe600;
    --ey-gray:#f3f3f5;
    --green:#2db84d;
    --red:#e0383e;
    --orange:#f5a623;
    --blue:#4a90d9;
    --border:#e3e3e8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--ey-gray);color:var(--ey-black);}
  header{background:var(--ey-black);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;}
  header .logo{background:var(--ey-yellow);color:var(--ey-black);font-weight:800;padding:4px 10px;border-radius:3px;font-size:18px;}
  header h1{font-size:18px;font-weight:600;}
  header .sub{font-size:12px;color:#bdbdc7;}
  .toolbar{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;}
  .toolbar button{background:var(--ey-yellow);color:var(--ey-black);border:none;padding:8px 14px;border-radius:4px;font-weight:600;cursor:pointer;}
  .toolbar button.ghost{background:#4a4a55;color:#fff;}
  .toolbar button:hover{filter:brightness(.95);}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}

  /* 诊断条 / 提示条 */
  .diag{font-size:12px;padding:7px 24px;background:#eef;color:#445;border-bottom:1px solid #dde;}
  .banner{padding:12px 24px;font-size:13px;display:none;}
  .banner.show{display:block;}
  .banner.err{background:#fdecec;color:#a01b22;border-bottom:1px solid #f5c2c4;}
  .banner.warn{background:#fff6e0;color:#8a5a00;border-bottom:1px solid #f3dfa6;}
  .banner.ok{background:#e9f8ee;color:#1d6b35;border-bottom:1px solid #bfe6cc;}
  .banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;}

  .wrap{padding:20px 24px;max-width:1500px;margin:0 auto;}
  .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .filters select,.filters input{padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fff;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:#fff;border-radius:8px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:3px solid var(--ey-yellow);}
  .card .label{font-size:12px;color:#888;margin-bottom:6px;}
  .card .value{font-size:26px;font-weight:700;}
  .card .value.small{font-size:18px;}
  .card.red{border-top-color:var(--red);} .card.green{border-top-color:var(--green);}
  .card.orange{border-top-color:var(--orange);} .card.blue{border-top-color:var(--blue);}

  .charts{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:20px;}
  .chart-box{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .chart-box h3{font-size:14px;margin-bottom:12px;color:#555;}
  @media(max-width:900px){.charts{grid-template-columns:1fr;}}

  .table-box{background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{background:#fafafa;color:#666;font-weight:600;position:sticky;top:0;}
  tr:hover td{background:#fffbe6;}
  .pill{padding:3px 9px;border-radius:12px;font-size:12px;color:#fff;font-weight:600;}
  .progress{background:#eee;border-radius:10px;height:16px;width:120px;position:relative;overflow:hidden;}
  .progress > span{position:absolute;left:0;top:0;height:100%;border-radius:10px;}
  .progress > em{position:absolute;width:100%;text-align:center;font-style:normal;font-size:11px;line-height:16px;color:#333;}
  .over{color:var(--red);font-weight:700;} .under{color:var(--green);font-weight:700;}

  .empty{padding:60px;text-align:center;color:#999;}
  footer{text-align:center;color:#aaa;font-size:12px;padding:20px;}
</style>
</head>
<body>

<header>
  <span class="logo">EY</span>
  <div>
    <h1>Daily Management 看板</h1>
    <div class="sub">底稿交付中心 · 项目进度与成本管控</div>
  </div>
  <div class="toolbar">
    <span><span class="status-dot" id="dot"></span> <span id="autoText">未连接</span></span>
    <span id="lastUpdate" style="color:#bdbdc7"></span>
    <button id="refreshBtn" class="ghost" style="display:none;">刷新</button>
    <button id="pickBtn">选择 Excel 文件</button>
  </div>
</header>

<!-- 诊断条：打开就能看到环境是否正常 -->
<div class="diag" id="diag">环境检测中…</div>
<div class="banner" id="banner"></div>

<!-- 永远可用的普通文件选择框（隐藏） -->
<input type="file" id="legacyInput" accept=".xlsx,.xlsm,.xls,.csv" style="display:none">

<div class="wrap">
  <div id="emptyState" class="empty">
    <p>👋 请点击右上角「选择 Excel 文件」，选中你的项目台账（.xlsx）。</p>
    <p style="font-size:13px;margin-top:8px;color:#bbb;">用 Edge/Chrome 通过 https 或本地服务器打开时，改完 Excel 保存即自动刷新；直接双击打开则点「刷新」手动更新。</p>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="filters">
      <select id="fManager"><option value="">全部项目经理</option></select>
      <select id="fStatus"><option value="">全部状态</option></select>
      <input type="text" id="fSearch" placeholder="搜索项目 / 客户…">
      <span style="font-size:12px;color:#999;" id="rowCount"></span>
    </div>

    <div class="cards" id="cards"></div>

    <div class="charts">
      <div class="chart-box"><h3>各项目进度</h3><canvas id="chartProgress" height="220"></canvas></div>
      <div class="chart-box"><h3>状态分布</h3><canvas id="chartStatus" height="220"></canvas></div>
    </div>
    <div class="charts" style="grid-template-columns:1fr;">
      <div class="chart-box"><h3>成本预算 vs 实际成本</h3><canvas id="chartCost" height="120"></canvas></div>
    </div>

    <div class="table-box">
      <table id="tbl">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<footer>数据来源：你选择的 Excel · 全部在本地浏览器完成，数据不会上传任何服务器</footer>

<script>
/* ========= 1. 配置区：列名要和你的 Excel 表头完全一致 ========= */
const COL = {
  name:"项目名称", client:"客户名称", manager:"项目经理", owner:"现场负责人",
  stage:"项目阶段", status:"状态", progress:"进度", planStart:"计划开始",
  planEnd:"计划完成", budgetHr:"预算工时", actualHr:"实际工时",
  budgetCost:"成本预算", actualCost:"实际成本", weekly:"本周进展", risk:"风险与问题"
};
const REFRESH_SECONDS = 5;
const STATUS_COLOR = {
  "进行中":"var(--blue)","已完成":"var(--green)","未开始":"#999",
  "风险":"var(--red)","预警":"var(--orange)","暂停":"var(--orange)"
};

const $ = id => document.getElementById(id);
let fileHandle=null, lastModified=0, allRows=[], autoTimer=null;
const hasFSA = ('showOpenFilePicker' in window);
const isFileProtocol = (location.protocol === 'file:');

/* ========= 诊断 & 提示 ========= */
function showBanner(type, html){
  const b=$('banner'); b.className='banner show '+type; b.innerHTML=html;
}
function hideBanner(){ $('banner').className='banner'; }

window.addEventListener('load', ()=>{
  const okX = (typeof XLSX !== 'undefined');
  const okC = (typeof Chart !== 'undefined');
  const how = isFileProtocol ? '本地双击(file://)' : (location.protocol+'//');
  $('diag').innerHTML =
    `打开方式：<b>${how}</b> ｜ Excel解析库：<b style="color:${okX?'#1d6b35':'#a01b22'}">${okX?'已加载✓':'未加载✗'}</b>`
    + ` ｜ 图表库：<b style="color:${okC?'#1d6b35':'#a01b22'}">${okC?'已加载✓':'未加载✗'}</b>`
    + ` ｜ 自动刷新：<b>${(hasFSA && !isFileProtocol)?'支持✓':'不支持（用“刷新”按钮）'}</b>`;

  if(!okX){
    showBanner('err',
      '❌ <b>未能加载 Excel 解析库</b>，无法读取表格。通常是公司网络屏蔽了外部网站。<br>'
      +'解决：下载 <code>xlsx.full.min.js</code> 放到本文件同一个文件夹，把顶部 &lt;script&gt; 的网址改成 <code>xlsx.full.min.js</code>（离线版我可以帮你直接做好）。');
  } else if(isFileProtocol){
    showBanner('warn',
      '⚠️ 当前是<b>本地双击打开</b>，浏览器会禁用“自动刷新”功能。看板可正常用，但 Excel 改动后需点右上角<b>「刷新」</b>。<br>'
      +'想要真正自动刷新：把本文件放到 GitHub Pages（https）打开，或用本地小服务器打开即可（我可帮你配）。');
  }
});

/* ========= 2. 选择文件（带自动降级，永不“没反应”）========= */
$('pickBtn').addEventListener('click', pickFile);
$('refreshBtn').addEventListener('click', manualRefresh);
$('legacyInput').addEventListener('change', async ()=>{
  const f=$('legacyInput').files[0]; if(!f) return;
  try{ parseBuffer(await f.arrayBuffer()); markUpdated(); afterLoad('manual'); }
  catch(err){ showBanner('err','❌ 读取失败：'+err.message); }
});

async function pickFile(){
  hideBanner();
  if(typeof XLSX==='undefined'){
    showBanner('err','❌ Excel 解析库未加载，无法读取。请见上方红色提示。'); return;
  }
  // 优先用“文件句柄”模式（可自动刷新）；只在非 file:// 下尝试
  if(hasFSA && !isFileProtocol){
    try{
      [fileHandle] = await window.showOpenFilePicker({
        types:[{description:'Excel/CSV',accept:{
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx','.xlsm','.xls'],
          'text/csv':['.csv']}}]
      });
      await readFromHandle(true);
      startAuto();
      afterLoad('auto');
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;          // 用户取消，不报错
      console.warn('文件句柄模式不可用，已降级为普通选择：', e);
    }
  }
  // 降级：普通文件选择框（任何浏览器/打开方式都能弹出）
  $('legacyInput').value='';
  $('legacyInput').click();
}

function afterLoad(mode){
  $('refreshBtn').style.display='inline-block';
  if(mode==='auto'){ $('autoText').textContent='自动刷新中（每'+REFRESH_SECONDS+'秒）'; }
  else{ $('autoText').textContent='已加载 · 手动刷新'; }
}

async function manualRefresh(){
  if(fileHandle){ try{ await readFromHandle(true); }catch(e){ showBanner('err','❌ 刷新失败：'+e.message);} }
  else{ $('legacyInput').value=''; $('legacyInput').click(); }  // 手动模式需重新选一次文件
}

function startAuto(){
  if(autoTimer) clearInterval(autoTimer);
  autoTimer=setInterval(async ()=>{ try{ await readFromHandle(false); }catch(e){} }, REFRESH_SECONDS*1000);
}
async function readFromHandle(force){
  const file=await fileHandle.getFile();
  if(!force && file.lastModified===lastModified) return;
  lastModified=file.lastModified;
  parseBuffer(await file.arrayBuffer());
  markUpdated();
}
function markUpdated(){ $('lastUpdate').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN'); }

function parseBuffer(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  allRows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}).filter(r=>String(r[COL.name]||'').trim()!=='');
  if(allRows.length===0){
    showBanner('warn','⚠️ 没读到数据。请检查 Excel 第一行表头里是否有「<code>项目名称</code>」这一列，且数据从第二行开始。');
  } else { hideBanner(); }
  initFilters(); render();
  $('emptyState').style.display='none';
  $('dashboard').style.display='block';
}

/* ========= 3. 工具函数 ========= */
const num=v=>{const n=parseFloat(String(v).replace(/[%,¥, ]/g,''));return isNaN(n)?0:n;};
function pct(v){let n=num(v); if(n>0&&n<=1)n*=100; return Math.max(0,Math.min(100,n));}
function fmtDate(v){ if(v instanceof Date) return v.toLocaleDateString('zh-CN'); return v||''; }
function money(n){ return n.toLocaleString('zh-CN',{maximumFractionDigits:0}); }

/* ========= 4. 筛选 ========= */
function initFilters(){
  fill('fManager', [...new Set(allRows.map(r=>r[COL.manager]).filter(Boolean))]);
  fill('fStatus',  [...new Set(allRows.map(r=>r[COL.status]).filter(Boolean))]);
}
function fill(id, items){
  const sel=$(id); const cur=sel.value;
  sel.innerHTML=sel.options[0].outerHTML+items.map(i=>`<option>${i}</option>`).join('');
  sel.value=cur;
}
['fManager','fStatus','fSearch'].forEach(id=>$(id).addEventListener('input',render));
function getFiltered(){
  const m=$('fManager').value,s=$('fStatus').value,kw=$('fSearch').value.trim();
  return allRows.filter(r=>
    (!m||r[COL.manager]==m)&&(!s||r[COL.status]==s)&&
    (!kw||String(r[COL.name]).includes(kw)||String(r[COL.client]).includes(kw)));
}

/* ========= 5. 渲染 ========= */
let charts={};
function render(){
  const rows=getFiltered();
  $('rowCount').textContent='共 '+rows.length+' 个项目';
  renderCards(rows); renderTable(rows); renderCharts(rows);
}
function renderCards(rows){
  const total=rows.length;
  const done=rows.filter(r=>r[COL.status]==='已完成').length;
  const doing=rows.filter(r=>r[COL.status]==='进行中').length;
  const risk=rows.filter(r=>['风险','预警'].includes(r[COL.status])).length;
  const avg=total? Math.round(rows.reduce((s,r)=>s+pct(r[COL.progress]),0)/total):0;
  const bCost=rows.reduce((s,r)=>s+num(r[COL.budgetCost]),0);
  const aCost=rows.reduce((s,r)=>s+num(r[COL.actualCost]),0);
  const bHr=rows.reduce((s,r)=>s+num(r[COL.budgetHr]),0);
  const aHr=rows.reduce((s,r)=>s+num(r[COL.actualHr]),0);
  const diff=aCost-bCost;
  const cards=[
    {l:'项目总数',v:total},
    {l:'进行中',v:doing,c:'blue'},
    {l:'已完成',v:done,c:'green'},
    {l:'风险/预警',v:risk,c:'red'},
    {l:'平均进度',v:avg+'%',c:'orange'},
    {l:'成本预算合计',v:'¥'+money(bCost),s:1},
    {l:'实际成本合计',v:'¥'+money(aCost),s:1},
    {l:'成本偏差',v:(diff>0?'+':'')+'¥'+money(diff),s:1,c:diff>0?'red':'green'},
    {l:'工时(实际/预算)',v:money(aHr)+' / '+money(bHr),s:1,c:aHr>bHr?'red':'green'},
  ];
  $('cards').innerHTML=cards.map(c=>
    `<div class="card ${c.c||''}"><div class="label">${c.l}</div><div class="value ${c.s?'small':''}">${c.v}</div></div>`).join('');
}
function renderTable(rows){
  const heads=['项目名称','客户','项目经理','负责人','阶段','状态','进度','计划完成','成本预算','实际成本','成本偏差','本周进展','风险'];
  $('thead').innerHTML=heads.map(h=>`<th>${h}</th>`).join('');
  $('tbody').innerHTML=rows.map(r=>{
    const p=pct(r[COL.progress]);
    const color=p>=100?'var(--green)':p>=50?'var(--blue)':'var(--orange)';
    const sc=STATUS_COLOR[r[COL.status]]||'#999';
    const diff=num(r[COL.actualCost])-num(r[COL.budgetCost]);
    const diffTxt=diff>0?`<span class="over">+${money(diff)}</span>`:`<span class="under">${money(diff)}</span>`;
    return `<tr>
      <td><b>${r[COL.name]||''}</b></td>
      <td>${r[COL.client]||''}</td>
      <td>${r[COL.manager]||''}</td>
      <td>${r[COL.owner]||''}</td>
      <td>${r[COL.stage]||''}</td>
      <td><span class="pill" style="background:${sc}">${r[COL.status]||'-'}</span></td>
      <td><div class="progress"><span style="width:${p}%;background:${color}"></span><em>${Math.round(p)}%</em></div></td>
      <td>${fmtDate(r[COL.planEnd])}</td>
      <td>¥${money(num(r[COL.budgetCost]))}</td>
      <td>¥${money(num(r[COL.actualCost]))}</td>
      <td>${diffTxt}</td>
      <td>${r[COL.weekly]||''}</td>
      <td style="color:var(--red)">${r[COL.risk]||''}</td>
    </tr>`;
  }).join('');
}
function renderCharts(rows){
  if(typeof Chart==='undefined') return;
  const names=rows.map(r=>r[COL.name]);
  draw('chartProgress','bar',{labels:names,datasets:[{label:'进度%',
    data:rows.map(r=>pct(r[COL.progress])),backgroundColor:'#4a90d9'}]},
    {indexAxis:'y',scales:{x:{max:100}},plugins:{legend:{display:false}}});
  const stCount={}; rows.forEach(r=>{const s=r[COL.status]||'未填';stCount[s]=(stCount[s]||0)+1;});
  draw('chartStatus','doughnut',{labels:Object.keys(stCount),datasets:[{data:Object.values(stCount),
    backgroundColor:Object.keys(stCount).map(s=>cssVar(STATUS_COLOR[s]||'#999'))}]},{});
  draw('chartCost','bar',{labels:names,datasets:[
    {label:'成本预算',data:rows.map(r=>num(r[COL.budgetCost])),backgroundColor:'#cccccc'},
    {label:'实际成本',data:rows.map(r=>num(r[COL.actualCost])),backgroundColor:'#ffe600'}]},{});
}
function draw(id,type,data,opts){
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart($(id),{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false},opts)});
}
function cssVar(v){ if(v.startsWith('var(')){const n=v.slice(4,-1);return getComputedStyle(document.documentElement).getPropertyValue(n).trim();} return v; }
</script>
</body>
</html>
